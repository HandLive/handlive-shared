# CI shared: kiểm test vector (thư viện độc lập với phía sinh), vector sinh lại byte-exact, JSON Schema
# đối chiếu ví dụ trong docs/detailed-design của kho hub, catalog chuỗi giao diện (strings/ui-strings.json). Bố cục workspace như máy dev: kho hub handlive
# ở gốc (checkout TRƯỚC — checkout ở gốc dọn sạch thư mục), kho này ở shared/.
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
name: ci-shared

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  check:
    name: vector + schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          # gh reads GH_TOKEN from the environment: the token never appears in a URL or on a command line.
          resolve() {
            n="$(gh api "repos/${OWNER}/$1/git/matching-refs/heads/${BRANCH}" --jq "map(select(.ref == \"refs/heads/${BRANCH}\")) | length" 2>/dev/null || echo 0)"
            if [ "$n" = 1 ]; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.refs.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: shared
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            shared/tools/vectors/requirements.txt
            shared/tools/schemas/requirements.txt
            shared/tools/strings/requirements.txt
            shared/tools/bench/requirements-load.txt
            shared/tools/e2e/requirements.txt
            shared/tools/e2e/relay_stack/requirements.txt

      - name: Cài phụ thuộc (phiên bản ghim)
        run: python -m pip install -r shared/tools/vectors/requirements.txt -r shared/tools/schemas/requirements.txt -r shared/tools/strings/requirements.txt -r shared/tools/bench/requirements-load.txt -r shared/tools/e2e/requirements.txt -r shared/tools/e2e/relay_stack/requirements.txt

      - name: Kiểm test vector
        run: python shared/tools/vectors/verify_vectors.py

      - name: Vector sinh lại khớp byte
        run: python shared/tools/vectors/generate_vectors.py --check

      - name: JSON Schema + ví dụ tài liệu
        run: python shared/tools/schemas/check_schemas.py

      - name: UI string catalog (checker self-test, catalog rules; --docs only warns)
        run: |
          python shared/tools/strings/check_strings.py --self-test
          python shared/tools/strings/check_strings.py --docs

      - name: Benchmark scripts on synthetic logs
        run: python shared/tools/bench/self_test.py

      - name: Relay load test against the in-process fake relay
        run: python shared/tools/bench/relay_load_self_test.py

      - name: End-to-end harness against the in-process fake phone (no emulator)
        run: python shared/tools/e2e/self_test.py

      - name: Local relay stack parts (TLS front, mock APNs and FCM, push envelopes; no relay, no database)
        run: python shared/tools/e2e/relay_stack/self_test.py
